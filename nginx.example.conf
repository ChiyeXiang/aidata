# AxisX / 子午象限官网 V16
# dist/ 里的内容部署到 /var/www/ziwuxx.com/ai/data/

server {
    listen 443 ssl http2;
    server_name www.ziwuxx.com ziwuxx.com;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/private.key;

    root /var/www/ziwuxx.com;

    location = /ai/data {
        return 301 /ai/data/;
    }

    # React SPA：所有不存在的前端路由回退到同一个 index.html
    location /ai/data/ {
        try_files $uri $uri/ /ai/data/index.html;
    }

    # Vite 带 hash 的构建文件可以长期缓存
    location /ai/data/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 视频不压缩，支持浏览器范围请求并设置短期缓存
    location /ai/data/meridian/clips/ {
        expires 7d;
        add_header Cache-Control "public";
        gzip off;
        try_files $uri =404;
    }

    location /ai/data/meridian/backgrounds/ {
        expires 7d;
        add_header Cache-Control "public";
        gzip off;
        try_files $uri =404;
    }

    # index.html 不做长期强缓存，确保新版上线后及时生效
    location = /ai/data/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    types {
        text/html                      html;
        text/css                       css;
        application/javascript         js;
        image/svg+xml                  svg;
        image/png                      png;
        image/jpeg                     jpg jpeg;
        image/webp                     webp;
        video/mp4                      mp4;
    }
}
